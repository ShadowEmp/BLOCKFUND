version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bct_mp_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crowdfunding_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Optional: Backend service
  # backend:
  #   build: ./backend
  #   container_name: bct_mp_backend
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - DATABASE_URL=postgres://postgres:postgres@postgres:5432/crowdfunding_db
  #     - JWT_SECRET=your_jwt_secret_key_here
  #     - PINATA_API_KEY=your_pinata_api_key
  #     - PINATA_SECRET_KEY=your_pinata_secret_key
  #   depends_on:
  #     - postgres

volumes:
  pgdata:
